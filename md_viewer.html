<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Markdown & Mermaid Viewer — Clarity Mode</title>

<!-- Keep fonts simple & local (system UI) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{--bg:#ffffff;--fg:#111827;--muted:#64748b;--border:#e2e8f0}
  *{box-sizing:border-box}
  body{
    font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,'Noto Sans',sans-serif;
    background:var(--bg); color:var(--fg); margin:0; padding:20px;
  }
  header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
  .title{font-weight:600}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px}
  .btn:hover{background:#f8fafc}
  label{font-size:12px;color:#475569;display:flex;gap:6px;align-items:center}
  input[type="range"]{vertical-align:middle}
  #drop{border:2px dashed var(--border);border-radius:12px;padding:10px 12px;color:#475569;font-size:12px;margin-bottom:8px}
  #out{background:#fff;border:1px solid var(--border);border-radius:12px;min-height:220px;padding:18px;overflow:auto}
  #name{color:#475569;font-size:12px;margin:6px 0 0 2px}
  .err{white-space:pre-wrap;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:10px;margin-top:12px;display:none}
  pre{overflow:auto;background:#0b1020;color:#e6edf3;padding:12px;border-radius:10px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
  <header>
    <div>
      <div class="title">Markdown & Mermaid Viewer — Clarity</div>
      <div id="name">No file loaded</div>
    </div>
    <div class="controls">
      <input id="file" type="file" accept=".mmd,.md,.markdown,text/markdown,text/plain" class="btn">
      <button id="copy" class="btn" title="Copy rendered HTML">Copy HTML</button>
      <button id="exportSvg" class="btn" title="Export rendered SVG">Export SVG</button>
      <label>Font Size <input id="font" type="range" min="12" max="22" value="16"></label>
      <label><input id="crisp" type="checkbox" checked> Crisp text</label>
      <label><input id="forceWhite" type="checkbox" checked> Force white boxes</label>
    </div>
  </header>

  <div id="drop">Tip: Drag & drop a .mmd or .md file here</div>
  <div id="out">Open a file to preview…</div>
  <div id="err" class="err"></div>

  <!-- libs (CDN) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    window.addEventListener('load', () => {
      // Elements / state
      const out = document.getElementById('out');
      const err = document.getElementById('err');
      const nameEl = document.getElementById('name');
      const fileInput = document.getElementById('file');
      const copyBtn = document.getElementById('copy');
      const exportBtn = document.getElementById('exportSvg');
      const drop = document.getElementById('drop');

      const font = document.getElementById('font');
      const crisp = document.getElementById('crisp');
      const forceWhite = document.getElementById('forceWhite');

      let lastText = '';
      let lastIsMmd = false;
      let lastFileName = '';

      // Markdown config
      marked.setOptions({
        gfm: true,
        highlight: (code, lang) => {
          try { return hljs.highlight(code, { language: lang }).value; }
          catch { return hljs.highlightAuto(code).value; }
        }
      });

      // Mermaid config (clarity-first, light theme, black text/lines)
      function mermaidConfig() {
        const fs = font.value + "px";
        return {
          startOnLoad: false,
          securityLevel: 'loose',
          theme: 'base',
          flowchart: { htmlLabels: true },
          sequence: { actorMargin: 48, messageMargin: 28, boxMargin: 14, noteMargin: 16 },
          themeVariables: {
            fontFamily: "system-ui,-apple-system,Segoe UI,Roboto,Arial,'Noto Sans',sans-serif",
            fontSize: fs,
            // Pure black text & lines; white node backgrounds by default
            textColor: "#111827",
            primaryTextColor: "#111827",
            lineColor: "#111827",
            primaryColor: "#ffffff",
            primaryBorderColor: "#111827",
            secondaryColor: "#ffffff",
            secondaryBorderColor: "#111827",
            tertiaryColor: "#ffffff",
            tertiaryBorderColor: "#111827",
            edgeLabelBackground: "#ffffff",
            actorBorder: "#111827",
            actorBkg: "#ffffff"
          },
          themeCSS: `
            svg { shape-rendering: geometricPrecision; background: #ffffff; }
            text, .nodeLabel, .edgeLabel, .cluster-label, .messageText, .title, .noteText, .actor > text {
              font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,'Noto Sans',sans-serif !important;
              font-size: ${fs} !important;
              ${crisp.checked ? 'text-rendering: geometricPrecision;' : 'text-rendering: optimizeLegibility;'}
              -webkit-font-smoothing: antialiased;
              letter-spacing: 0.005em;
              fill: #111827 !important;
              stroke: #ffffff;                /* halo to prevent line-through text */
              stroke-width: 3px; stroke-linejoin: round; stroke-linecap: round;
              paint-order: stroke fill;
            }
            /* Lines & shapes: thicker, black */
            line, path, rect, polygon, ellipse, circle { stroke-width: 1.8px !important; stroke: #111827 !important; }
            .node rect, .node polygon, .cluster rect, .actor, .note {
              stroke-width: 1.8px !important; stroke: #111827 !important; fill: #ffffff !important;
            }
            .messageLine0, .messageLine1, .loopLine { stroke-width: 2px !important; }
          `
        };
      }

      // Optional: force all node backgrounds white even if the .mmd uses classDefs/colors
      function injectClarityOverrides(svgEl) {
        if (!forceWhite.checked) return;
        const style = document.createElementNS('http://www.w3.org/2000/svg','style');
        style.textContent = `
          .node rect, .node polygon, .cluster rect, .actor, .note { fill: #ffffff !important; }
          .label foreignObject > div { color: #111827 !important; background: transparent !important; }
        `;
        svgEl.prepend(style);
      }

      // Renderers
      async function renderMermaid(text) {
        try {
          err.style.display = 'none';
          mermaid.initialize(mermaidConfig());
          const id = 'mmd-' + Math.random().toString(36).slice(2);
          const { svg } = await mermaid.render(id, text);
          out.innerHTML = svg;
          const svgEl = out.querySelector('svg');
          if (svgEl) injectClarityOverrides(svgEl);
        } catch (e) {
          out.innerHTML = '';
          err.style.display = 'block';
          err.textContent = 'Mermaid render error:\\n' + (e?.message || e);
        }
      }

      async function renderMarkdown(text) {
        err.style.display = 'none';
        const raw = marked.parse(text);
        const tmp = document.createElement('div');
        tmp.innerHTML = DOMPurify.sanitize(raw);

        // Convert ```mermaid blocks to SVG with clarity theme
        const blocks = tmp.querySelectorAll('pre code.language-mermaid');
        mermaid.initialize(mermaidConfig());
        for (const codeEl of blocks) {
          const graph = codeEl.textContent;
          const holder = document.createElement('div');
          try {
            const id = 'mmd-' + Math.random().toString(36).slice(2);
            const { svg } = await mermaid.render(id, graph);
            holder.innerHTML = svg;
            codeEl.closest('pre').replaceWith(holder);
            const svgEl = holder.querySelector('svg');
            if (svgEl) injectClarityOverrides(svgEl);
          } catch (e) {
            const warn = document.createElement('div');
            warn.className = 'err';
            warn.style.display = 'block';
            warn.textContent = 'Mermaid block error:\\n' + (e?.message || e);
            codeEl.closest('pre').replaceWith(warn);
          }
        }
        out.innerHTML = tmp.innerHTML;
      }

      async function renderFile(file) {
        const name = file.name.toLowerCase();
        const text = await file.text();
        lastText = text; lastIsMmd = name.endsWith('.mmd'); lastFileName = file.name;
        nameEl.textContent = file.name;
        document.title = file.name + (lastIsMmd ? ' — Mermaid' : ' — Markdown');
        if (lastIsMmd) await renderMermaid(text); else await renderMarkdown(text);
      }

      // UI wiring
      fileInput.addEventListener('change', e => {
        const f = e.target.files?.[0];
        if (f) renderFile(f);
      });

      // Drag & drop
      ['dragenter','dragover','dragleave','drop'].forEach(ev => {
        drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
      });
      ['dragenter','dragover'].forEach(ev => {
        drop.addEventListener(ev, () => drop.style.borderColor = '#6366f1');
      });
      ['dragleave','drop'].forEach(ev => {
        drop.addEventListener(ev, () => drop.style.borderColor = '#e2e8f0');
      });
      drop.addEventListener('drop', e => {
        const f = e.dataTransfer.files?.[0];
        if (f) renderFile(f);
      });

      copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(out.innerHTML);
        alert('Rendered HTML copied to clipboard');
      });

      exportBtn.addEventListener('click', () => {
        const svg = out.querySelector('svg');
        if (!svg) { alert('No SVG found. Load a .mmd or a Markdown with ```mermaid block.'); return; }
        const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (lastFileName?.replace(/\.(mmd|md|markdown|txt)$/i, '') || 'diagram') + '.svg';
        a.click();
        URL.revokeObjectURL(a.href);
      });

      // Live re-render on settings change
      const reRender = () => { if (!lastText) return; lastIsMmd ? renderMermaid(lastText) : renderMarkdown(lastText); };
      font.addEventListener('input', reRender);
      crisp.addEventListener('change', reRender);
      forceWhite.addEventListener('change', reRender);

      out.innerHTML = "Open a file to preview…";
    });
  </script>
</body>
</html>
