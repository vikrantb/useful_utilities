<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Markdown & Mermaid Viewer (Crisp)</title>

<!-- Clean, legible font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{--bg:#fff;--fg:#0f172a;--muted:#64748b;--border:#e2e8f0}
  body{font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,'Noto Sans',sans-serif;background:var(--bg);color:var(--fg);max-width:980px;margin:28px auto;padding:0 16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .hint{color:var(--muted);font-size:12px}
  #out{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;min-height:200px}
  pre{overflow:auto;background:#0b1020;color:#e6edf3;padding:12px;border-radius:10px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .btn{border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 12px;font-size:14px;cursor:pointer}
  .btn:hover{background:#f8fafc}
  .err{white-space:pre-wrap;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:10px;margin-top:12px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .range{vertical-align:middle}
  label{font-size:12px;color:#475569}
</style>
</head>
<body>
  <header>
    <div>
      <strong>Markdown & Mermaid Viewer</strong>
      <div class="hint">Open a local <code>.mmd</code> (Mermaid) or <code>.md</code> file</div>
    </div>
    <div class="controls">
      <input id="file" type="file" accept=".mmd,.md,.markdown,text/markdown,text/plain" class="btn">
      <button id="copy" class="btn" title="Copy rendered HTML">Copy HTML</button>
      <label>Font Size <input id="font" class="range" type="range" min="12" max="22" value="16"></label>
      <label><input id="crisp" type="checkbox" checked> Crisp text</label>
      <label><input id="dark" type="checkbox"> Dark diagram theme</label>
    </div>
  </header>

  <div id="out">Open a file to preview…</div>
  <div id="err" class="err" style="display:none"></div>

  <!-- libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    // Markdown config
    marked.setOptions({
      gfm: true,
      highlight: (code, lang) => {
        try { return hljs.highlight(code, { language: lang }).value; }
        catch { return hljs.highlightAuto(code).value; }
      }
    });

    // State so we can re-render when knobs change
    let lastText = '';
    let lastIsMmd = false;

    const out = document.getElementById('out');
    const err = document.getElementById('err');
    const font = document.getElementById('font');
    const crisp = document.getElementById('crisp');
    const darkToggle = document.getElementById('dark');

    function mermaidConfig() {
      const darkPref = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const dark = darkToggle.checked || (!darkToggle.checked && darkPref);
      return {
        startOnLoad: false,
        securityLevel: 'loose',
        theme: dark ? 'dark' : 'default',
        flowchart: { htmlLabels: true },
        themeVariables: {
          fontFamily: "Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Noto Sans', sans-serif",
          fontSize: font.value + "px",
          textColor: dark ? "#f8fafc" : "#0f172a",
          primaryTextColor: dark ? "#f8fafc" : "#0f172a",
          lineColor: dark ? "#94a3b8" : "#0f172a",
          primaryBorderColor: dark ? "#94a3b8" : "#0f172a",
          edgeLabelBackground: dark ? "#0b1020" : "#ffffff",
        },
        themeCSS: `
          svg { shape-rendering: geometricPrecision; }
          text, .nodeLabel, .edgeLabel, .cluster-label, .messageText, .title {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Noto Sans', sans-serif !important;
            font-size: ${font.value}px !important;
            ${crisp.checked ? 'text-rendering: geometricPrecision;' : 'text-rendering: optimizeLegibility;'}
            -webkit-font-smoothing: antialiased;
            font-kerning: normal;
            letter-spacing: 0.01em;
          }
          .label foreignObject > div {
            font-family: inherit; font-size: inherit; color: inherit;
          }
        `
      };
    }

    function injectSvgCrispStyles(svgEl) {
      // Extra insurance: put the same CSS inside the SVG for portability (copy/paste)
      const style = document.createElementNS('http://www.w3.org/2000/svg','style');
      style.textContent = `
        text, .nodeLabel, .edgeLabel, .cluster-label, .messageText, .title {
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Noto Sans', sans-serif !important;
          font-size: ${font.value}px !important;
          ${crisp.checked ? 'text-rendering: geometricPrecision;' : 'text-rendering: optimizeLegibility;'}
          -webkit-font-smoothing: antialiased;
          letter-spacing: 0.01em;
        }
      `;
      svgEl.prepend(style);
    }

    async function renderMermaid(text) {
      try {
        err.style.display = 'none';
        mermaid.initialize(mermaidConfig());
        const id = 'mmd-' + Math.random().toString(36).slice(2);
        const { svg } = await mermaid.render(id, text);
        out.innerHTML = svg;
        const svgEl = out.querySelector('svg');
        if (svgEl) injectSvgCrispStyles(svgEl);
      } catch (e) {
        console.error(e);
        out.innerHTML = '';
        err.style.display = 'block';
        err.textContent = 'Mermaid render error:\n' + (e?.message || e);
      }
    }

    async function renderMarkdown(text) {
      err.style.display = 'none';
      const rawHtml = marked.parse(text);
      const tmp = document.createElement('div');
      tmp.innerHTML = DOMPurify.sanitize(rawHtml);

      // Convert ```mermaid blocks to SVG
      const blocks = tmp.querySelectorAll('pre code.language-mermaid');
      mermaid.initialize(mermaidConfig());
      for (const codeEl of blocks) {
        const graph = codeEl.textContent;
        const holder = document.createElement('div');
        try {
          const id = 'mmd-' + Math.random().toString(36).slice(2);
          const { svg } = await mermaid.render(id, graph);
          holder.innerHTML = svg;
          codeEl.closest('pre').replaceWith(holder);
          const svgEl = holder.querySelector('svg');
          if (svgEl) injectSvgCrispStyles(svgEl);
        } catch (e) {
          const warn = document.createElement('div');
          warn.className = 'err';
          warn.textContent = 'Mermaid block error:\n' + (e?.message || e);
          codeEl.closest('pre').replaceWith(warn);
        }
      }
      out.innerHTML = tmp.innerHTML;
    }

    async function renderFile(file) {
      const name = file.name.toLowerCase();
      const text = await file.text();
      lastText = text;
      lastIsMmd = name.endsWith('.mmd');
      document.title = file.name + (lastIsMmd ? ' — Mermaid' : ' — Markdown');
      if (lastIsMmd) await renderMermaid(text);
      else await renderMarkdown(text);
    }

    // UI wiring
    document.getElementById('file').addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (f) renderFile(f);
    });
    document.getElementById('copy').addEventListener('click', async () => {
      const html = out.innerHTML;
      await navigator.clipboard.writeText(html);
      alert('Rendered HTML copied to clipboard');
    });
    font.addEventListener('input', () => { if (lastText) lastIsMmd ? renderMermaid(lastText) : renderMarkdown(lastText); });
    crisp.addEventListener('change', () => { if (lastText) lastIsMmd ? renderMermaid(lastText) : renderMarkdown(lastText); });
    darkToggle.addEventListener('change', () => { if (lastText) lastIsMmd ? renderMermaid(lastText) : renderMarkdown(lastText); });
  </script>
</body>
</html>
